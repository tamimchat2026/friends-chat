<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Friends Chat</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column}
.hide{display:none!important}
#auth{margin:auto;width:90%;max-width:360px;display:flex;flex-direction:column;gap:10px}
#auth h1{text-align:center;margin-bottom:10px}
input{background:#121212;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;font-size:16px;width:100%}
button{background:#3797f0;color:#fff;border:0;padding:12px;border-radius:10px;font-size:16px;cursor:pointer}
button.link{background:none;color:#3797f0;padding:6px}
#err{color:#ff6b6b;font-size:14px;text-align:center}
#chat{flex:1;display:flex;flex-direction:column;min-height:0}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #262626}
header button{background:none;color:#3797f0;padding:4px}
#list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:8px 12px;border-radius:18px;background:#262626;align-self:flex-start;word-wrap:break-word}
.msg.me{background:#3797f0;align-self:flex-end}
.msg .n{font-size:11px;opacity:.7;margin-bottom:2px}
#form{display:flex;gap:8px;padding:10px;border-top:1px solid #262626}
#form button{padding:12px 16px}
</style>
</head>
<body>

<div id="auth">
  <h1>Friends Chat</h1>
  <input id="name" placeholder="তোমার নাম (শুধু সাইন আপে)">
  <input id="email" type="email" placeholder="ইমেইল">
  <input id="pass" type="password" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)">
  <div id="err"></div>
  <button id="signin">লগইন</button>
  <button id="signup" class="link">নতুন অ্যাকাউন্ট খুলুন</button>
</div>

<div id="chat" class="hide">
  <header><b>Friends Chat</b><button id="out">লগআউট</button></header>
  <div id="list"></div>
  <form id="form">
    <input id="text" placeholder="মেসেজ লেখো..." autocomplete="off">
    <button type="submit">পাঠাও</button>
  </form>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,updateProfile,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,addDoc,query,orderBy,limit,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCa-eZsDLQAZjHzS2Kay1V3ZE0PS9iqd5Q",
  authDomain: "friends-chat-web-384c3.firebaseapp.com",
  projectId: "friends-chat-web-384c3",
  storageBucket: "friends-chat-web-384c3.firebasestorage.app",
  messagingSenderId: "403378851841",
  appId: "1:403378851841:web:a1126d55ad2356ef85f000"
});
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
let unsub = null;

function showErr(e){ $("err").textContent = e.message.replace("Firebase: ",""); }

$("signin").onclick = async () => {
  try { await signInWithEmailAndPassword(auth, $("email").value, $("pass").value); }
  catch(e){ showErr(e); }
};
$("signup").onclick = async () => {
  const name = $("name").value.trim();
  if(!name){ $("err").textContent = "আগে নাম লেখো"; return; }
  try {
    const c = await createUserWithEmailAndPassword(auth, $("email").value, $("pass").value);
    await updateProfile(c.user, {displayName: name});
  } catch(e){ showErr(e); }
};
$("out").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  if(user){
    $("auth").classList.add("hide");
    $("chat").classList.remove("hide");
    startChat(user);
  } else {
    if(unsub){ unsub(); unsub = null; }
    $("chat").classList.add("hide");
    $("auth").classList.remove("hide");
  }
});

function startChat(user){
  if(unsub) unsub();
  const q = query(collection(db,"messages"), orderBy("createdAt"), limit(200));
  unsub = onSnapshot(q, snap => {
    const list = $("list");
    list.innerHTML = "";
    snap.forEach(d => {
      const m = d.data();
      const el = document.createElement("div");
      el.className = "msg" + (m.uid === user.uid ? " me" : "");
      const n = document.createElement("div");
      n.className = "n";
      n.textContent = m.name || "বন্ধু";
      const t = document.createElement("div");
      t.textContent = m.text || "";
      el.append(n, t);
      list.appendChild(el);
    });
    list.scrollTop = list.scrollHeight;
  });
  $("form").onsubmit = async e => {
    e.preventDefault();
    const text = $("text").value.trim();
    if(!text) return;
    $("text").value = "";
    await addDoc(collection(db,"messages"), {
      text, uid: user.uid, name: user.displayName || "বন্ধু", createdAt: serverTimestamp()
    });
  };
}
</script>
</body>
</html>
